<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>مَن أنا؟ - أبعاد الأمن الوطني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* لعبة «مَن أنا؟» — رحّالة، الصف السابع، تهيئة حصة مراجعة الوحدة الخامسة (٢٤ نوفمبر ٢٠٢٦).
     أربع بطاقات تُعرض واحدة تلو الأخرى: على وجهها المعلومة، ولمسة تقلبها فتظهر البُعد، والتالية بعدها (ص129–131، نص الكتاب في UNITS_DATA[6]).
     الهوية: عنابي #7a1232 وذهبي رملي — والبطاقات بألوان هادئة كتصميم المعلم */
  :root{
    --navy:#7a1232; --navy-deep:#420a1c; --gold:#dba73c; --gold-light:#f6dc96; --gold-deep:#68430b;
    --cream:#f8f3ef; --ink:#1f1216; --muted:#594a50; --good:#12804f;
    --shadow:0 6px 18px rgba(66,10,28,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);overflow:hidden;
    font-family:"Cairo","Tajawal","Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif}
  #app{display:flex;flex-direction:column;height:100%;padding:10px 14px;gap:10px}
  .iconbtn{border:0;background:#eee3db;color:var(--navy-deep);border-radius:12px;height:46px;font-size:20px;cursor:pointer;font-family:inherit;flex:1}
  .iconbtn:hover{background:#e4d4c8}
  main{flex:1;display:flex;gap:14px;min-height:0}
  #stageWrap{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}

  /* ═══ البطاقات المقلوبة ═══ */
  /* بطاقة واحدة في كل مرة (طلب المالك، ٢٤ نوفمبر ٢٠٢٦): تُقلب فتظهر الإجابة، ثم تنتقل للتالية */
  #cards{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center}
  .flip{position:relative;perspective:1600px;cursor:pointer;min-height:0;border:0;padding:0;background:none;font-family:inherit;color:inherit;
    width:100%;max-width:1000px;animation:slideIn .45s cubic-bezier(.3,1.2,.5,1) both}
  @keyframes slideIn{from{opacity:0;transform:translateX(-60px) scale(.96)}to{opacity:1;transform:none}}
  .flip:focus-visible{outline:4px solid var(--gold);outline-offset:4px;border-radius:24px}
  .inner{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
  .flip.open .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,26px);
    padding:clamp(12px,1.6vw,26px);text-align:center;box-shadow:var(--shadow);border:2px solid rgba(31,18,22,.08)}
  .front{background:var(--bg)}
  .flip:hover .front{filter:brightness(.98)}
  .qmark{width:clamp(64px,8vw,120px);height:clamp(64px,8vw,120px);border-radius:50%;background:var(--deep);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(34px,4.4vw,70px);flex:none;
    box-shadow:0 5px 0 rgba(0,0,0,.2)}
  .clue{font-weight:800;font-size:clamp(22px,3vw,48px);line-height:1.6;color:var(--ink);max-width:24em}
  .tap{font-weight:700;font-size:clamp(14px,1.3vw,20px);color:var(--muted)}
  .back{transform:rotateY(180deg);background:var(--deep);color:#fff}
  .back .ico{font-size:clamp(60px,8vw,140px);line-height:1;animation:none}
  .flip.open .back .ico{animation:bounce .8s .35s ease both}
  @keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .back .ansLbl{font-weight:700;font-size:clamp(16px,1.7vw,26px);color:var(--gold-light)}
  .back .ans{font-family:"Aref Ruqaa","Cairo",serif;font-size:clamp(38px,5.4vw,90px);line-height:1.25;
    background:rgba(0,0,0,.2);border-radius:18px;padding:6px 18px}
  .back .mini{font-weight:600;font-size:clamp(16px,1.8vw,28px);line-height:1.6}
  .k0{--bg:#d9ede3;--deep:#175a4a}   /* العسكري — أخضر */
  .k1{--bg:#e7dcef;--deep:#6b3fa0}   /* السياسي — بنفسجي */
  .k2{--bg:#f4d9e3;--deep:#a71944}   /* الاقتصادي — وردي */
  .k3{--bg:#f6dfd2;--deep:#8a2c0e}   /* الاجتماعي — خوخي */

  /* ═══ اللوحة الجانبية (يسار) ═══ */
  #pad{width:clamp(190px,19vw,270px);display:flex;flex-direction:column;gap:10px}
  .box{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);text-align:center;font-size:clamp(14px,1.4vw,18px);font-weight:700;line-height:1.5}
  .box b{color:var(--navy);font-size:1.7em}
  .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
  .dots i{width:16px;height:16px;border-radius:50%;background:#eee3db}
  .dots i.ok{background:var(--good)}
  .btn{border:0;border-radius:12px;padding:10px 14px;font-family:inherit;font-weight:800;font-size:clamp(14px,1.4vw,18px);cursor:pointer;background:#eee3db;color:var(--navy-deep)}
  .btn:hover{background:#e4d4c8}
  .btn:disabled{cursor:default;color:var(--muted)}
  .btn.main{background:var(--navy);color:#fff;font-size:clamp(16px,1.7vw,22px);padding:14px}
  .btn.main:hover{background:var(--navy-deep)}
  .row{display:flex;gap:8px}
  .row .btn{flex:1;min-width:0}
  .spacer{flex:1}
  .stats,.btns{display:flex;flex-direction:column;gap:10px}
  html.embedded #pad{width:clamp(170px,16vw,240px)}
  /* داخل رحّالة بملء الشاشة: خانة #wheelSlot تضع رحّالة عجلة المشاركة فوقها */
  #wheelSlot{display:none}
  html.hostWheel #pad{width:clamp(300px,24vw,440px)}
  html.hostWheel #wheelSlot{display:block;flex:1;width:100%;min-height:0}
  html.hostWheel #pad .spacer{display:none}
  html.hostWheel .stats{flex-direction:row}
  html.hostWheel .btns{gap:6px}
  html.hostWheel .stats .box{flex:1;min-width:0}
  html.hostWheel .stats .box{padding:6px 8px;font-size:clamp(13px,1.1vw,16px)}
  html.hostWheel .stats .box b{font-size:1.4em}
  html.hostWheel .btns .btn{padding:8px 6px;font-size:clamp(13px,1.1vw,16px)}
  html.hostWheel .iconbtn{height:40px}

  .conf{position:fixed;top:-20px;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:20;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (max-width:760px){ main{flex-direction:column} #pad{width:100%;flex-direction:row;flex-wrap:wrap} #cards{min-height:460px} body{overflow:auto} }
</style>
</head>
<body>
<div id="app">
  <main>
    <section id="stageWrap">
      <div id="cards"></div>
    </section>

    <aside id="pad">
      <div class="stats">
        <div class="box">البطاقة<br><b id="cnt">1</b> / 4<div class="dots" id="dots"></div></div>
      </div>
      <div id="wheelSlot"></div>
      <div class="spacer"></div>
      <div class="btns">
        <button class="btn main" id="goBtn">اكشف الإجابة 👁</button>
        <div class="row">
          <button class="btn" id="prevBtn" title="البطاقة السابقة">→ السابقة</button>
          <button class="btn" id="newBtn" title="من جديد">↻</button>
        </div>
        <div class="row">
          <button class="iconbtn" id="soundBtn" title="الصوت" aria-label="الصوت">🔊</button>
          <button class="iconbtn" id="fsBtn" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
// ═══════ البطاقات — المعلومات من تصميم المعلم، والأبعاد مطابقة لنص الكتاب (الدرس الأول: الأمن الوطني وأبعاده) ═══════
// k = لون البطاقة، a = البُعد (الإجابة)، more = معلومة من الكتاب تظهر مع الإجابة
const CARDS = [
  {k:0, ico:'🛡️', clue:'أعزّز قدرة الدولة الدفاعية لمنع كل مَن تسوّل له نفسه النيل من أمن الوطن.', a:'الأمن العسكري',
   more:'ويُخضع جميع الأفراد والجماعات لسلطة القانون.'},
  {k:1, ico:'🏛️', clue:'أحمي البلاد من الفوضى والاضطراب، وأشمل الالتفاف حول أمير البلاد.', a:'الأمن السياسي',
   more:'وهو يُكمّل الجانب العسكري.'},
  {k:2, ico:'💰', clue:'أهدف إلى الاستغلال الأمثل للموارد وتحقيق الاكتفاء الذاتي.', a:'الأمن الاقتصادي',
   more:'وإيجاد أسواق خارجية متعددة.'},
  {k:3, ico:'🤝', clue:'أحافظ على استقرار المجتمع وتماسكه دون المساس بالدين واللغة والهوية.', a:'الأمن الاجتماعي',
   more:'ويندرج ضمنه الأمن السيبراني.'}
];

const $ = id => document.getElementById(id);
let soundOn = true, cur = 0, shown = false, done = false;

// ═══════ الأصوات — مولّدة بالمتصفح، بلا ملفات ═══════
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type, vol, delay){
  const a = soundOn && audio(); if(!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  flip(){ [392, 523, 659].forEach((f, i) => tone(f, .25, 'triangle', .16, i * .07)); },
  back(){ tone(330, .15, 'sine', .1); },
  win(){ [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, .35, 'triangle', .2, i * .15)); }
};

// بطاقة واحدة على السبورة: النقرة الأولى تقلبها فتظهر الإجابة، والثانية تنقل للبطاقة التالية
function show(i){
  cur = i; shown = false;
  const c = CARDS[i], b = document.createElement('button');
  b.type = 'button'; b.className = 'flip k' + c.k;
  b.setAttribute('aria-label', 'البطاقة ' + (i + 1) + ': ' + c.clue);
  b.innerHTML = `<div class="inner">
      <div class="face front"><div class="qmark">؟</div><div class="clue"></div><div class="tap">👆 انقر لتظهر الإجابة</div></div>
      <div class="face back"><div class="ico">${c.ico}</div><div class="ansLbl">أنا…</div><div class="ans"></div><div class="mini"></div></div>
    </div>`;
  b.querySelector('.clue').textContent = c.clue;
  b.querySelector('.ans').textContent = c.a;
  b.querySelector('.mini').textContent = c.more;
  b.onclick = step;
  $('cards').replaceChildren(b);
  update();
}
function reveal(){
  shown = true; $('cards').firstChild.classList.add('open'); sfx.flip();
  if(cur === CARDS.length - 1 && !done){ done = true; setTimeout(celebrate, 600); }
  update();
}
// الخطوة التالية: اكشف الإجابة، أو انتقل للبطاقة التالية، أو ابدأ من جديد بعد الأخيرة
function step(){
  if(!shown) reveal();
  else if(cur < CARDS.length - 1) show(cur + 1);
  else restart();
}
function prev(){ if(cur > 0){ show(cur - 1); sfx.back(); } }
function restart(){ done = false; show(0); sfx.back(); }
function update(){
  $('cnt').textContent = cur + 1;
  $('dots').innerHTML = CARDS.map((c, i) => `<i class="${i < cur || (i === cur && shown) ? 'ok' : ''}"></i>`).join('');
  $('goBtn').textContent = !shown ? 'اكشف الإجابة 👁' : cur < CARDS.length - 1 ? 'البطاقة التالية ←' : 'من جديد ↻';
  $('prevBtn').disabled = cur === 0;
}
function celebrate(){
  sfx.win();
  const cols = ['#7a1232', '#dba73c', '#175a4a', '#6b3fa0', '#a71944'];
  for(let i = 0; i < 70; i++){
    const d = document.createElement('div'); d.className = 'conf';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[i % cols.length];
    d.style.animationDuration = (1.8 + Math.random() * 1.6) + 's'; d.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 4200);
  }
}
$('goBtn').onclick = step;
$('prevBtn').onclick = prev;
$('newBtn').onclick = restart;
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; };
// داخل رحّالة: ⛶ يكبّر الصفحة كلها (البطاقات + عجلة المشاركة) لا اللعبة وحدها
$('fsBtn').onclick = () => {
  try{ if(window.parent !== window && window.parent.lsEmbedFull){ window.parent.lsEmbedFull(); return; } }catch(e){}
  if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen();
};
// المسافة/Enter/السهم الأيسر = الخطوة التالية، والسهم الأيمن = السابقة، و F لملء الشاشة
window.addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowLeft'){ e.preventDefault(); step(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); prev(); }
  else if(e.key === 'f' || e.key === 'F') $('fsBtn').onclick();
});
document.querySelectorAll('.btn, .iconbtn').forEach(b => b.addEventListener('mouseup', () => b.blur()));
show(0);
</script>
</body>
</html>
